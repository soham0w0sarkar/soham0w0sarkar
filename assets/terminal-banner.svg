<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Soham Sarkar - backend and systems engineer</title>
  <desc id="desc">Animated terminal interface highlighting distributed systems, Go, TypeScript, CRDTs, and WebSockets.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080c14" />
      <stop offset="0.55" stop-color="#0c1220" />
      <stop offset="1" stop-color="#101329" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d9ff" />
      <stop offset="1" stop-color="#8b5cf6" />
    </linearGradient>
    <radialGradient id="aura" cx="78%" cy="42%" r="58%">
      <stop offset="0" stop-color="#7f5cff" stop-opacity="0.16" />
      <stop offset="0.5" stop-color="#00d9ff" stop-opacity="0.06" />
      <stop offset="1" stop-color="#080c14" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#62e9ff" stroke-opacity="0.045" stroke-width="1" />
    </pattern>
    <filter id="cyanGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="window">
      <rect width="900" height="380" rx="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#window)">
    <rect width="900" height="380" fill="url(#background)" />
    <rect width="900" height="380" fill="url(#aura)" />
    <rect y="38" width="900" height="342" fill="url(#grid)" />

    <!-- Ambient circuit paths -->
    <g fill="none" stroke="#00d9ff" stroke-opacity="0.11" stroke-width="1">
      <path d="M610 80H662L682 100H850" />
      <path d="M630 302H700L722 280H875" />
      <path d="M580 170H640L665 145H850" />
      <path d="M600 238H652L674 260H838" />
    </g>
    <g fill="#00d9ff" filter="url(#cyanGlow)">
      <circle cx="682" cy="100" r="2.5">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="2.8s" repeatCount="indefinite" />
      </circle>
      <circle cx="722" cy="280" r="2.5">
        <animate attributeName="opacity" values="1;0.25;1" dur="3.4s" repeatCount="indefinite" />
      </circle>
      <circle cx="665" cy="145" r="2.5">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Window chrome -->
    <rect width="900" height="38" fill="#111827" fill-opacity="0.96" />
    <line x1="0" y1="38" x2="900" y2="38" stroke="#263248" />
    <circle cx="22" cy="19" r="5.5" fill="#ff5f57" />
    <circle cx="42" cy="19" r="5.5" fill="#febc2e" />
    <circle cx="62" cy="19" r="5.5" fill="#28c840" />
    <text x="450" y="24" text-anchor="middle" fill="#7d8aa3" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">soham@kernel: ~/systems/profile</text>
    <text x="866" y="24" text-anchor="end" fill="#34425c" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">UTF-8</text>

    <!-- Main terminal -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="34" y="78" font-size="14">
        <tspan fill="#00d9ff">soham@dev</tspan><tspan fill="#60708d">:</tspan><tspan fill="#8b5cf6">~</tspan><tspan fill="#c9d1d9">$ whoami</tspan>
      </text>

      <text x="34" y="126" fill="#f0f6fc" font-size="34" font-weight="700" letter-spacing="-1">SOHAM SARKAR</text>
      <rect x="34" y="140" width="132" height="3" rx="1.5" fill="url(#accent)" />
      <text x="34" y="169" fill="#9aa8bd" font-size="16">BACKEND / SYSTEMS ENGINEER</text>

      <text x="34" y="215" font-size="14">
        <tspan fill="#00d9ff">focus</tspan><tspan fill="#60708d"> :: </tspan><tspan fill="#d8dee9">distributed systems</tspan>
      </text>
      <text x="34" y="242" font-size="14">
        <tspan fill="#8b5cf6">signal</tspan><tspan fill="#60708d"> :: </tspan><tspan fill="#d8dee9">real-time collaboration</tspan>
      </text>
      <text x="34" y="269" font-size="14">
        <tspan fill="#00d9ff">stack</tspan><tspan fill="#60708d"> :: </tspan><tspan fill="#d8dee9">Go / TypeScript / WebSockets</tspan>
      </text>

      <text x="34" y="320" font-size="14">
        <tspan fill="#00d9ff">soham@dev</tspan><tspan fill="#60708d">:</tspan><tspan fill="#8b5cf6">~</tspan><tspan fill="#c9d1d9">$ build --for-scale</tspan>
      </text>
      <rect x="293" y="306" width="9" height="18" rx="1" fill="#00d9ff">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.5;1" dur="1s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Right telemetry panel -->
    <g transform="translate(615 72)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <rect width="250" height="246" rx="10" fill="#080d17" fill-opacity="0.78" stroke="#263753" />
      <path d="M0 42H250" stroke="#263753" />
      <circle cx="18" cy="21" r="4" fill="#28c840" filter="url(#cyanGlow)">
        <animate attributeName="opacity" values="1;0.45;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="31" y="26" fill="#c9d1d9" font-size="12">SYSTEM TELEMETRY</text>
      <text x="231" y="26" text-anchor="end" fill="#28c840" font-size="10">ONLINE</text>

      <text x="18" y="70" fill="#62708a" font-size="10">CURRENT PROJECT</text>
      <text x="18" y="94" fill="#00d9ff" font-size="20" font-weight="700">WEAVO</text>
      <text x="18" y="114" fill="#9aa8bd" font-size="11">collaborative text SDK</text>

      <text x="18" y="148" fill="#62708a" font-size="10">SYNC ENGINE</text>
      <rect x="18" y="159" width="214" height="7" rx="3.5" fill="#1c2638" />
      <rect x="18" y="159" width="186" height="7" rx="3.5" fill="url(#accent)">
        <animate attributeName="width" values="155;205;186;155" dur="5s" repeatCount="indefinite" />
      </rect>
      <text x="18" y="187" fill="#7f8da5" font-size="10">CRDT</text>
      <text x="231" y="187" text-anchor="end" fill="#d8dee9" font-size="10">CONFLICT-FREE</text>

      <g transform="translate(18 207)">
        <rect width="60" height="22" rx="4" fill="#00d9ff" fill-opacity="0.1" stroke="#00d9ff" stroke-opacity="0.35" />
        <text x="30" y="15" text-anchor="middle" fill="#00d9ff" font-size="9">LATENCY</text>
        <rect x="70" width="64" height="22" rx="4" fill="#8b5cf6" fill-opacity="0.1" stroke="#8b5cf6" stroke-opacity="0.35" />
        <text x="102" y="15" text-anchor="middle" fill="#b79aff" font-size="9">SCALE</text>
        <rect x="144" width="70" height="22" rx="4" fill="#28c840" fill-opacity="0.1" stroke="#28c840" stroke-opacity="0.35" />
        <text x="179" y="15" text-anchor="middle" fill="#62dc77" font-size="9">SHIP</text>
      </g>
    </g>

    <!-- Moving scan line -->
    <rect x="0" y="38" width="900" height="1" fill="#00d9ff" opacity="0.13">
      <animate attributeName="y" values="38;379;38" dur="7s" repeatCount="indefinite" />
    </rect>
  </g>

  <rect x="0.75" y="0.75" width="898.5" height="378.5" rx="15.25" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-opacity="0.72" />
</svg>
